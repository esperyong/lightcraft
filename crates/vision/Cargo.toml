[package]
name = "lightcraft-vision"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightCraft vision (L3): Apple's Vision framework on macOS — what a photo shows, how good it looks, its subject. Allowed `unsafe` for its Objective-C calls, behind a safe API."

# Opts out of the workspace lints only to keep `unsafe_code = "deny"` overridable for the one module that calls
# Objective-C (`macos`); like crates/sysmem and crates/mpsgraph. See AGENTS.md and craftrules standards/never-crash.md
# ("isolated helper library crate").
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[dependencies]

# The bindings are pure Rust (no C build step); the frameworks are the system's own, as for wgpu's Metal backend.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-foundation = { workspace = true, features = ["std", "NSArray", "NSDictionary", "NSEnumerator", "NSError", "NSIndexSet", "NSObject", "NSString"] }
objc2-core-foundation = { workspace = true, features = ["std", "CFData", "CFString"] }
objc2-core-graphics = { workspace = true, features = ["std", "objc2", "CGColorSpace", "CGDataProvider", "CGImage"] }
objc2-core-video = { workspace = true, features = ["std", "objc2", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-vision = { workspace = true, features = [
    "std",
    "objc2-core-graphics",
    "objc2-core-video",
    "VNCalculateImageAestheticsScoresRequest",
    "VNClassifyImageRequest",
    "VNGenerateForegroundInstanceMaskRequest",
    "VNObservation",
    "VNRequest",
    "VNRequestHandler",
    "VNTypes",
] }

[dev-dependencies]
lightcraft-codecs = { workspace = true }
lightcraft-geom = { workspace = true }
